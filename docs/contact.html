<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — Emmanuel Vibes Media</title>
  <meta name="author" content="Emmanuel Ibekwe">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Emmanuel Vibes Media</h1>
    <nav>
      <a href="contact.html">Contact</a>
      <a href="bookings.html">Bookings</a>
    </nav>
  </header>

  <main>
    <section id="contact">
      <h2>Contact</h2>
      <p>If you’d like to get in touch, please send a message below.</p>
      <form id="contactForm">
        <label>
          Name
          <input type="text" name="name" required>
        </label>
        <label>
          Email
          <input type="email" name="email">
        </label>
        <label>
          Message
          <textarea name="message" required></textarea>
        </label>
        <button type="submit">Send</button>
      </form>
      <div id="formResult" aria-live="polite"></div>
    </section>
  </main>

  <footer>
    <p>© 2026 Emmanuel Ibekwe</p>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
